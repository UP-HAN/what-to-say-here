<style>
  :root{

  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);}
  #app{font-family:'Gothic A1',system-ui,sans-serif;color:var(--ink);
    max-width:460px;margin:0 auto;padding:0 18px 90px;-webkit-font-smoothing:antialiased;}
  .en{font-family:'Archivo',system-ui,sans-serif;}
  :focus-visible{outline:3px solid var(--ink);outline-offset:2px;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

  header{padding:26px 0 16px;}
  .eyebrow{font-family:'Archivo';font-weight:600;font-size:11px;letter-spacing:.18em;
    color:var(--muted);display:flex;align-items:center;gap:7px;}
  .eyebrow i{display:block;width:16px;height:2px;background:var(--signal);}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:9px;line-height:1.25;}

  .tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:20px;}
  .tab{padding:12px 4px;margin-right:22px;font-size:15px;font-weight:700;color:var(--muted);
    border-bottom:3px solid transparent;margin-bottom:-2px;}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);}
  .badge{background:var(--signal);border-radius:100px;padding:1px 7px;font-size:12px;
    font-weight:800;margin-left:5px;color:var(--ink);}

  .searchbar{display:flex;border:2px solid var(--ink);border-radius:var(--radius);background:var(--card);}
  .searchbar input{flex:1;border:none;background:none;padding:15px 14px;font-size:16px;
    font-family:inherit;font-weight:500;color:var(--ink);min-width:0;}
  .searchbar input::placeholder{color:#A9AFA6;font-weight:400;}
  .searchbar input:focus{outline:none;}
  .go{background:var(--ink);color:#fff;padding:0 18px;font-weight:700;font-size:15px;}
  .hint{font-size:13px;color:var(--ink-2);margin-top:10px;font-weight:500;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:100px;
    padding:7px 13px;font-size:13px;font-weight:500;color:var(--ink-2);}
  .chip:hover{border-color:var(--ink);}
  .offbadge{margin-top:16px;background:var(--ink);color:#fff;border-radius:var(--radius);
    padding:11px 14px;font-size:12.5px;line-height:1.5;}
  .offbadge b{color:var(--signal);}

  .place{background:var(--ink);color:#fff;border-radius:var(--radius);padding:17px 18px;
    margin-top:24px;display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .place .name{font-family:'Archivo';font-weight:700;font-size:19px;letter-spacing:-.01em;line-height:1.2;}
  .place .kind{font-size:12.5px;color:var(--signal);font-weight:600;margin-top:5px;}
  .place .arrow{font-size:22px;color:var(--signal);}

  .qlabel{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:24px 0 10px;}
  .sits{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .sit{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 13px;text-align:left;font-size:14.5px;font-weight:700;
    display:flex;align-items:center;gap:9px;line-height:1.3;}
  .sit em{font-style:normal;font-size:17px;}
  .sit:hover{border-color:var(--ink);}
  .sit[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}

  .bulk{width:100%;margin:20px 0 12px;background:var(--signal);border-radius:var(--radius);
    padding:15px;font-size:15px;font-weight:800;}
  .bulk.done{background:var(--card);border:1px solid var(--line);color:var(--muted);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 17px 15px;margin-bottom:12px;}
  .tag{display:inline-block;background:var(--signal);font-size:11px;font-weight:800;
    padding:3px 8px;border-radius:100px;margin-bottom:11px;}
  .tag.only{background:var(--ink);color:#fff;}
  .mine{font-family:'Archivo';font-weight:700;font-size:26px;line-height:1.22;letter-spacing:-.025em;}
  .ko{font-size:15px;font-weight:500;color:var(--ink-2);margin-top:8px;line-height:1.45;}
  .sound{margin-top:11px;padding:9px 12px;background:#FBF7E4;border-left:3px solid var(--signal);
    font-size:15.5px;font-weight:700;letter-spacing:-.01em;}
  .note{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .vol{font-size:11.5px;color:var(--ink-2);margin-top:8px;background:#F3F4F0;
    padding:6px 9px;border-radius:3px;line-height:1.45;}

  .reply{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  .replyhead{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:10px;}
  .rline{display:flex;gap:9px;align-items:flex-start;margin-bottom:12px;}
  .rline:last-child{margin-bottom:0;}
  .rtag{background:var(--ink);color:#fff;font-size:10.5px;font-weight:800;padding:3px 7px;

  .ren{font-family:'Archivo';font-weight:600;font-size:16px;letter-spacing:-.01em;line-height:1.3;}
  .rsound{font-size:13.5px;font-weight:700;color:var(--ink-2);margin-top:3px;}
  .rko{font-size:13px;color:var(--muted);margin-top:2px;}

  .acts{display:flex;gap:7px;margin-top:15px;flex-wrap:wrap;}
  .act{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;
    font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px;}
  .act:hover{border-color:var(--ink);}
  .act.primary{background:var(--ink);color:#fff;border-color:var(--ink);flex:1;justify-content:center;}
  .act.saved{background:#FBF7E4;border-color:var(--signal);}
  .again{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--card);
    border-radius:var(--radius);padding:14px;font-size:14px;font-weight:700;}

  .nores{margin-top:24px;background:var(--card);border:1px solid var(--ink);
    border-radius:var(--radius);padding:18px;}
  .nores b{font-size:15.5px;display:block;margin-bottom:6px;}
  .nores p{font-size:13.5px;color:var(--muted);line-height:1.55;}
  .all{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}

  .empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
    padding:30px 20px;text-align:center;}
  .empty b{display:block;font-size:16px;margin-bottom:8px;}
  .empty p{font-size:13.5px;color:var(--muted);line-height:1.6;}
  .group{margin-bottom:26px;}
  .grouphead{display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:12px;}
  .grouphead .g1{font-weight:800;font-size:16px;}
  .grouphead .g2{font-size:12.5px;color:var(--muted);font-weight:600;}

  #show{position:fixed;inset:0;background:var(--ink);color:#fff;z-index:50;
    display:none;flex-direction:column;justify-content:center;
    padding:70px 24px 84px;overflow-y:auto;}
  #show.on{display:flex;}
  #closeShow{position:absolute;top:10px;right:10px;width:60px;height:60px;
    display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:300;
    color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:50%;}
  #show .pre{font-family:'Archivo';font-weight:800;font-size:clamp(21px,5.8vw,30px);
    letter-spacing:-.01em;color:var(--signal);line-height:1.2;}
  #show .pre-ko{font-size:12.5px;color:rgba(255,255,255,.42);margin:12px 0 22px;line-height:1.45;}
  #show .big{font-family:'Archivo';font-weight:800;font-size:clamp(29px,9vw,52px);

  #show .speak{margin-top:26px;border:2px solid rgba(255,255,255,.35);border-radius:100px;

    font-size:12.5px;color:rgba(255,255,255,.55);line-height:1.5;}
</style>

<div id="app">
  <header>
    <div class="eyebrow"><i></i>PLACE → PHRASE</div>

  </header>

  </div>

</div>

</div>

const EXAMPLES = ["나리타 공항","입국심사","하와이 힐튼호텔","스타벅스","그랜드 캐니언","약국","지하철","디즈니랜드"];
const out = document.getElementById('out'), qEl = document.getElementById('q');
const savedView = document.getElementById('savedView');
let R = null, activeSit = null, saved = [];

/* ---------- 저장 ---------- */
async function loadSaved(){
  try{ const r = await window.storage.get('mycards'); saved = r ? JSON.parse(r.value) : []; }
  catch(e){ saved = []; }
  paintCount();
}
async function persist(){ paintCount(); try{ await window.storage.set('mycards', JSON.stringify(saved)); }catch(e){} }
function paintCount(){ document.getElementById('cnt').textContent = saved.length; }
function keyOf(c){ return (c.place||'')+'|'+(c.sit||'')+'|'+c.en; }

/* ---------- 검색 ---------- */
function norm(s){ return s.toLowerCase().replace(/\s+/g,''); }
function lookup(input){
  const n = norm(input);
  if(!n) return null;
  for(const [k,v] of Object.entries(DB.landmarks))
    if(v.keywords.some(w => n.includes(norm(w)))) return { kind:'landmark', key:k, data:v };
  for(const [k,v] of Object.entries(DB.types))
    if(v.keywords.some(w => n.includes(norm(w)))) return { kind:'type', key:k, data:v };
  return null;
}

document.getElementById('chips').innerHTML = EXAMPLES.map(e=>`<button class="chip" data-q="${e}">${e}</button>`).join('');
document.getElementById('chips').onclick = e => {
  const b = e.target.closest('.chip'); if(!b) return;
  qEl.value = b.dataset.q; search();
};
document.getElementById('goBtn').onclick = search;
qEl.addEventListener('keydown', e => { if(e.key==='Enter') search(); });
function pick(k){ qEl.value = DB.types[k].label; search(); }

function search(){
  const r = lookup(qEl.value);
  if(!r){ noResult(); return; }
  R = r; activeSit = (r.kind === 'type') ? null : 0;
  render();
}
function noResult(){
  out.innerHTML = `<div class="nores">
    <b>그 이름은 아직 없어요</b>
    <p>대신 아래에서 비슷한 곳을 골라보세요. 가려는 곳이 어떤 종류인지만 고르면 됩니다.</p>
    <div class="all">${Object.entries(DB.types).map(([k,v])=>
      `<button class="sit" onclick="pick('${k}')">${v.label}</button>`).join('')}</div>
  </div>`;
}

/* ---------- 화면 ---------- */
function render(){
  const isLM = R.kind === 'landmark';
  const label = R.data.label;
  out.innerHTML = `
    <div class="place">
      <div><div class="name">${label}</div>
      <div class="kind">${isLM ? '명소' : '장소 종류'}</div></div>
      <div class="arrow">→</div>
    </div>
    ${isLM ? '' : `<div class="qlabel">어떤 상황인가요?</div>
      <div class="sits" id="sits">${R.data.situations.map((s,i)=>
        `<button class="sit" data-i="${i}" aria-pressed="${activeSit===i}"><em>${s.emoji}</em>${s.label}</button>`).join('')}</div>`}
    <div id="cards"></div>`;
  if(!isLM){
    document.getElementById('sits').onclick = e => {
      const b = e.target.closest('.sit'); if(!b) return;
      activeSit = +b.dataset.i; render();
    };
  }
  paintCards();
}

function currentCards(){
  if(!R) return [];
  if(R.kind === 'landmark'){
    const own = R.data.cards.map(c=>({...c, only:true}));
    return own.concat(DB.common['관광지'].cards);
  }
  if(activeSit === null) return [];
  return R.data.situations[activeSit].cards;
}
function stamp(c){
  return {...c, place:R.data.label,
    sit: R.kind==='landmark' ? '명소' : R.data.situations[activeSit].label};
}

function paintCards(){
  const box = document.getElementById('cards'); if(!box) return;
  const list = currentCards();
  if(!list.length){ box.innerHTML = ''; return; }
  const stamped = list.map(stamp);
  const allIn = stamped.every(c => saved.some(s => keyOf(s)===keyOf(c)));
  box.innerHTML = `
    <button class="bulk ${allIn?'done':''}" onclick="saveAll()">
      ${allIn ? '✓ 여기 카드는 모두 담았어요' : '⭐ 이 카드 전부 담아두기'}</button>
    ${list.map((c,i)=>cardHtml(c,i,saved.some(s=>keyOf(s)===keyOf(stamped[i])))).join('')}
    <button class="again" onclick="document.getElementById('q').select()">다른 곳 찾아보기</button>`;
}

function esc(s){ return (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

function cardHtml(c, idx, on){
  return `<div class="card">
    ${c.only ? '<span class="tag only">여기서만 쓰는 말</span>'
             : (idx===0 ? '<span class="tag">가장 많이 써요</span>' : '')}
    <div class="mine en">${c.en}</div>
    <div class="ko">${c.ko}</div>
    <div class="sound">${c.sound}</div>
    ${c.note ? `<div class="note">${c.note}</div>` : ''}
    ${c.volatile ? `<div class="vol">⚠️ 규정이 바뀔 수 있어요. 현장에서 다시 확인하세요.</div>` : ''}
    ${replyHtml(c)}
    <div class="acts">
      <button class="act primary" onclick="showBig('${esc(c.en)}')">📱 보여주기</button>
      <button class="act" onclick="say('${esc(c.en)}')">🔊 듣기</button>
      <button class="act" onclick="say('${esc(c.en)}',0.6)">🐢 천천히</button>
    </div>
    <div class="acts">
      <button class="act ${on?'saved':''}" style="flex:1;justify-content:center"
        onclick="toggleSave(${idx})">${on?'✓ 담았어요':'⭐ 담아두기'}</button>
    </div>
  </div>`;
}
function replyHtml(c){
  if(!c.reply || !c.reply.length) return '';
  return `<div class="reply"><div class="replyhead">상대방이 이렇게 말할 수 있어요</div>
    ${c.reply.map(r=>`<div class="rline"><span class="rtag">상대</span><div>
      <div class="ren">${r.en}</div><div class="rsound">${r.sound}</div><div class="rko">${r.ko}</div>
      <button class="act" style="margin-top:8px;padding:6px 11px;font-size:12px"
        onclick="say('${esc(r.en)}')">🔊 듣기</button></div></div>`).join('')}</div>`;
}

async function toggleSave(i){
  const c = stamp(currentCards()[i]);
  const at = saved.findIndex(s => keyOf(s)===keyOf(c));
  if(at>=0) saved.splice(at,1); else saved.push(c);
  await persist(); paintCards();
}
async function saveAll(){
  currentCards().map(stamp).forEach(c=>{
    if(!saved.some(s=>keyOf(s)===keyOf(c))) saved.push(c);
  });
  await persist(); paintCards();
}
async function removeSaved(k){ saved = saved.filter(s=>keyOf(s)!==k); await persist(); renderSaved(); }

/* ---------- 내 카드 ---------- */
document.getElementById('tabFind').onclick = ()=>switchTab('find');
document.getElementById('tabSaved').onclick = ()=>switchTab('saved');
function switchTab(t){
  const f = t==='find';
  document.getElementById('tabFind').setAttribute('aria-selected', f);
  document.getElementById('tabSaved').setAttribute('aria-selected', !f);
  document.getElementById('findView').style.display = f?'':'none';
  savedView.style.display = f?'none':'';
  if(!f) renderSaved();
}
function renderSaved(){
  if(!saved.length){
    savedView.innerHTML = `<div class="empty"><b>아직 담아둔 카드가 없어요</b>
      <p>여행 가기 전에 미리 담아두세요.<br>담아둔 카드는 인터넷이 없어도 열립니다.</p></div>`;
    return;
  }
  const g = {};
  saved.forEach(c => { const k = c.place+'§'+c.sit; (g[k] = g[k]||[]).push(c); });
  savedView.innerHTML = Object.entries(g).map(([k,list])=>{
    const [pl,st] = k.split('§');
    return `<div class="group">
      <div class="grouphead"><div class="g1">${pl}</div><div class="g2">${st} · ${list.length}장</div></div>
      ${list.map(c=>`<div class="card">
        <div class="mine en">${c.en}</div><div class="ko">${c.ko}</div>
        <div class="sound">${c.sound}</div>${replyHtml(c)}
        <div class="acts">
          <button class="act primary" onclick="showBig('${esc(c.en)}')">📱 보여주기</button>
          <button class="act" onclick="say('${esc(c.en)}')">🔊 듣기</button>
          <button class="act" onclick="say('${esc(c.en)}',0.6)">🐢 천천히</button>
        </div>
        <div class="acts"><button class="act" style="flex:1;justify-content:center;color:var(--muted)"
          onclick="removeSaved('${esc(keyOf(c))}')">빼기</button></div>
      </div>`).join('')}</div>`;
  }).join('');
}

/* ---------- 소리 · 보여주기 ---------- */
function say(text, rate){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate = rate || 0.92;
  speechSynthesis.speak(u);
}
const showEl = document.getElementById('show');
let wake = null;
async function showBig(text){
  document.getElementById('showText').textContent = text;
  document.getElementById('showSpeak').onclick = ()=>say(text);
  showEl.classList.add('on');
  try{ wake = await navigator.wakeLock.request('screen'); }catch(e){}
}
document.getElementById('closeShow').onclick = closeShow;
function closeShow(){ showEl.classList.remove('on'); try{ wake && wake.release(); wake=null; }catch(e){} }
document.addEventListener('keydown', e => { if(e.key==='Escape') closeShow(); });

loadSaved();
</script>
